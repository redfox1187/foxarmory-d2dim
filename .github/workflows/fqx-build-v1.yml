name: FQX Build v1.0 Release Candidate

on:
  push:
    branches:
      - work/fqx-manifest-slice-20261006
    paths:
      - "tools/v1/**"
      - ".github/workflows/fqx-build-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Destiny manifest
        run: |
          curl -fSL "https://www.bungie.net/common/destiny2_content/sqlite/en/world_sql_content_a695ee698e87bcb0333c1026ba10cd63.content" -o manifest.content
          mkdir manifestdb
          unzip -q manifest.content -d manifestdb

      - name: Build and audit v1.0
        run: |
          python tools/v1/generate_release.py "$(find manifestdb -type f | head -1)"

      - name: Upload v1.0 candidate
        uses: actions/upload-artifact@v4
        with:
          name: fqx-d2dim-v1.0-release-candidate
          path: build/
          if-no-files-found: error
          retention-days: 3
