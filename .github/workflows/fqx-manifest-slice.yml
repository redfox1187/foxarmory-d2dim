name: FQX Destiny Manifest Roll Index

on:
  push:
    branches:
      - work/fqx-manifest-slice-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Destiny manifest
        run: |
          curl -fSL "https://www.bungie.net/common/destiny2_content/sqlite/en/world_sql_content_a695ee698e87bcb0333c1026ba10cd63.content" -o manifest.content
          mkdir manifestdb
          unzip -q manifest.content -d manifestdb

      - name: Build compact weapon roll index
        shell: python
        run: |
          import json, sqlite3, pathlib, gzip

          MANIFEST_VERSION = "244213.26.06.29.2000-1-bnet.65864"
          db_path = next(pathlib.Path("manifestdb").iterdir())
          con = sqlite3.connect(db_path)
          con.row_factory = sqlite3.Row

          def load_table(name):
              out = {}
              for row in con.execute(f'SELECT id, json FROM "{name}"'):
                  try:
                      obj = json.loads(row["json"])
                  except Exception:
                      continue
                  h = int(row["id"]) & 0xffffffff
                  out[h] = obj
              return out

          plugsets = load_table("DestinyPlugSetDefinition")
          socket_categories = load_table("DestinySocketCategoryDefinition")
          socket_types = load_table("DestinySocketTypeDefinition")

          item_names = {}
          weapons = {}

          for row in con.execute('SELECT id, json FROM "DestinyInventoryItemDefinition"'):
              try:
                  obj = json.loads(row["json"])
              except Exception:
                  continue
              h = int(row["id"]) & 0xffffffff
              name = (obj.get("displayProperties") or {}).get("name") or ""
              item_names[h] = name
              if obj.get("itemType") == 3 and obj.get("sockets"):
                  weapons[h] = obj

          category_names = {
              h: ((o.get("displayProperties") or {}).get("name") or "")
              for h, o in socket_categories.items()
          }
          socket_type_names = {
              h: ((o.get("displayProperties") or {}).get("name") or "")
              for h, o in socket_types.items()
          }

          def plugset_options(psh):
              ps = plugsets.get(psh) or {}
              out = []
              for e in ps.get("reusablePlugItems") or []:
                  ph = e.get("plugItemHash")
                  if ph is None:
                      continue
                  out.append({
                      "hash": int(ph),
                      "name": item_names.get(int(ph), ""),
                  })
              return out

          index = {}
          total_slots = 0
          for wh, w in weapons.items():
              sockets = (w.get("sockets") or {}).get("socketEntries") or []
              cats = (w.get("sockets") or {}).get("socketCategories") or []
              cat_by_socket = {}
              for c in cats:
                  cname = category_names.get(c.get("socketCategoryHash"), "")
                  for si in c.get("socketIndexes") or []:
                      cat_by_socket[int(si)] = cname

              slots = []
              for i, s in enumerate(sockets):
                  options = []
                  seen = set()

                  def add(ph, source):
                      if ph is None:
                          return
                      ph = int(ph)
                      if ph in seen:
                          return
                      seen.add(ph)
                      options.append({
                          "hash": ph,
                          "name": item_names.get(ph, ""),
                          "source": source,
                      })

                  add(s.get("singleInitialItemHash"), "initial")

                  for psh, source in [
                      (s.get("randomizedPlugSetHash"), "randomizedPlugSet"),
                      (s.get("reusablePlugSetHash"), "reusablePlugSet"),
                  ]:
                      if psh:
                          for o in plugset_options(int(psh)):
                              add(o["hash"], source)

                  for rp in s.get("reusablePlugItems") or []:
                      add(rp.get("plugItemHash"), "reusablePlugItems")

                  if not options:
                      continue

                  sth = s.get("socketTypeHash")
                  slot = {
                      "socket_index": i,
                      "category": cat_by_socket.get(i, ""),
                      "socket_type_hash": int(sth) if sth is not None else None,
                      "socket_type": socket_type_names.get(int(sth), "") if sth is not None else "",
                      "randomized_plug_set_hash": int(s["randomizedPlugSetHash"]) if s.get("randomizedPlugSetHash") else None,
                      "reusable_plug_set_hash": int(s["reusablePlugSetHash"]) if s.get("reusablePlugSetHash") else None,
                      "options": options,
                  }
                  slots.append(slot)
                  total_slots += 1

              index[str(wh)] = {
                  "weapon_hash": wh,
                  "name": (w.get("displayProperties") or {}).get("name") or "",
                  "item_type_display_name": w.get("itemTypeDisplayName") or "",
                  "slots": slots,
              }

          con.close()

          payload = {
              "manifest_version": MANIFEST_VERSION,
              "source": "Bungie mobileWorldContentPaths.en",
              "weapon_count": len(index),
              "slot_count": total_slots,
              "weapons": index,
          }

          with gzip.open("fqx_destiny_weapon_roll_index.json.gz", "wt", encoding="utf-8", compresslevel=9) as f:
              json.dump(payload, f, separators=(",", ":"))

          pathlib.Path("fqx_destiny_manifest_meta.json").write_text(
              json.dumps({
                  "manifest_version": MANIFEST_VERSION,
                  "weapon_count": len(index),
                  "slot_count": total_slots,
                  "artifact": "fqx_destiny_weapon_roll_index.json.gz"
              }, indent=2),
              encoding="utf-8"
          )

      - name: Upload roll index
        uses: actions/upload-artifact@v4
        with:
          name: fqx-destiny-weapon-roll-index
          path: |
            fqx_destiny_weapon_roll_index.json.gz
            fqx_destiny_manifest_meta.json
          if-no-files-found: error
          retention-days: 1
