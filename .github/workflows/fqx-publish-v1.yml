name: FQX Publish v1.0 Release Branch

on:
  push:
    branches:
      - work/fqx-manifest-slice-20261006
    paths:
      - ".github/workflows/fqx-publish-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified Destiny manifest
        run: |
          curl -fSL "https://www.bungie.net/common/destiny2_content/sqlite/en/world_sql_content_a695ee698e87bcb0333c1026ba10cd63.content" -o manifest.content
          mkdir manifestdb
          unzip -q manifest.content -d manifestdb

      - name: Rebuild and verify v1.0 release bytes
        run: |
          python tools/v1/generate_release.py "$(find manifestdb -type f | head -1)"
          echo "0b746522137fd3376da382a69909752fcda5374ae83aab18d8ec47ff8ba8c2e2  build/foxarmory-2026-return-d2dim.v1.0.txt" | sha256sum -c -

      - name: Stage clean release branch from master
        run: |
          rm -rf /tmp/fqx-v1-release
          mkdir -p /tmp/fqx-v1-release/history /tmp/fqx-v1-release/tools/v1 /tmp/fqx-v1-release/v1
          cp build/foxarmory-2026-return-d2dim.v1.0.txt /tmp/fqx-v1-release/foxarmory-2026-return-d2dim.txt
          cp -R history/. /tmp/fqx-v1-release/history/
          cp tools/v1/generate_release.py /tmp/fqx-v1-release/tools/v1/
          cp build/fqx_v1_release_audit.json /tmp/fqx-v1-release/v1/
          cp build/report_fqx-destiny-2_v1.0-release_20261006.md /tmp/fqx-v1-release/v1/
          cp build/D2_v1_Inferred_Fallbacks_20261006.csv /tmp/fqx-v1-release/v1/
          cp build/D2_v1_Inferred_Exotics_20261006.csv /tmp/fqx-v1-release/v1/

          git fetch origin master
          git checkout -B release/v1.0 origin/master

          cp /tmp/fqx-v1-release/foxarmory-2026-return-d2dim.txt foxarmory-2026-return-d2dim.txt
          rm -rf history
          cp -R /tmp/fqx-v1-release/history history
          mkdir -p history/v1.0
          cp /tmp/fqx-v1-release/v1/* history/v1.0/
          mkdir -p tools/v1
          cp /tmp/fqx-v1-release/tools/v1/generate_release.py tools/v1/generate_release.py

          cat > history/v1.0/README.md <<'EOF'
          # v1.0 — Full-manifest profile-governed release

          **Status:** repository-native release candidate
          **Date:** 2026-10-06
          **Manifest:** 244213.26.06.29.2000-1-bnet.65864
          **Wishlist SHA-256:** 0b746522137fd3376da382a69909752fcda5374ae83aab18d8ec47ff8ba8c2e2

          v1.0 preserves verified v0.9 semantics, covers every current-manifest Legendary and Exotic weapon definition, protects Fox's exact owned Favorites, and adds explicitly labeled inferred ratings where curated coverage was absent.

          See the release audit and inference CSVs in this directory for coverage and provenance.
          EOF

          git config user.name "FQX Wishlist Release"
          git config user.email "actions@users.noreply.github.com"
          git add foxarmory-2026-return-d2dim.txt history tools/v1/generate_release.py
          git commit -m "Release Fox Armory 2026 Return v1.0"
          git push origin HEAD:refs/heads/release/v1.0 --force
