name: FQX Tag v1.0

on:
  push:
    branches:
      - work/fqx-manifest-slice-20261006
    paths:
      - ".github/workflows/fqx-tag-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Pin v1.0 release tag
        run: |
          git fetch --tags origin
          if git ls-remote --exit-code --tags origin refs/tags/v1.0 >/dev/null 2>&1; then
            echo "v1.0 tag already exists; leaving it untouched."
            exit 0
          fi
          git config user.name "FQX Wishlist Release"
          git config user.email "actions@users.noreply.github.com"
          git tag -a v1.0 -m "Fox Armory 2026 Return v1.0" 08063a43baccaf360d7551ffcd51475d50a7fdc4
          git push origin refs/tags/v1.0
